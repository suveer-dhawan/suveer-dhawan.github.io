# The Site Configuration
theme: jekyll-theme-chirpy
lang: en
timezone: Australia/Melbourne

title: Suveer Dhawan
tagline: AI @ Woodside | Data Science @ Monash | Economics @ NYUAD
description: >-
  A global journey from Abu Dhabi to Melbourne, specializing in Industrial AI and Quantitative Economics.

url: "https://suveer-dhawan.github.io"
baseurl: ""

github:
  username: suveer-dhawan

social:
  name: Suveer Dhawan
  email: suveer.dhawan@nyu.edu
  links:
    - https://github.com/suveer-dhawan
    - https://www.linkedin.com/in/suveer-dhawan
    - https://open.spotify.com/user/f2vrpupzwqbtoas6mhve1legi

avatar: "/assets/img/avatar.png"
toc: true
paginate: 10

pwa:
  enabled: true
  cache:
    enabled: true

# ------------ Core Engine Settings (Do not modify below) ------------------
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" 
      type: posts
    values:
      layout: post
      comments: false 
      toc: true 
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/